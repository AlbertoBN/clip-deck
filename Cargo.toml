[workspace]
resolver = "2"
members = [
    "crates/clip-core",
    "crates/clip-store",
    "crates/clip-platform",
    "crates/clip-ipc",
    "crates/clipd",
    "crates/clip-ui-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
clip-core = { path = "crates/clip-core" }
clip-store = { path = "crates/clip-store" }
clip-platform = { path = "crates/clip-platform" }
clip-ipc = { path = "crates/clip-ipc" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
directories = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
image = "0.25"
mime = "0.3"
mime_guess = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
