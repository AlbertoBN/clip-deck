[package]
name = "clip-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clip-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
x11rb = { version = "0.13", features = ["xfixes", "xtest"] }
global-hotkey = "0.6"
image.workspace = true
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Wayland bindings are deliberately left out until that adapter is implemented;
# see the PRD's "Recommended crate choices" table before picking versions.

[dev-dependencies]
tempfile = "3"
