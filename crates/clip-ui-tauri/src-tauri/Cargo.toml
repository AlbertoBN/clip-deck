[package]
name = "clip-ui-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ClipDeck Tauri host: popup, manager, settings windows; tray bootstrap."

[lib]
name = "clip_ui_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
clip-core.workspace = true
clip-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2.11.3", features = ["tray-icon"] }
ammonia = "4"
async-trait = "0.1"
