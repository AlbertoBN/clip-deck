[package]
name = "clip-ui-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "clip-ui-tauri"
path = "src/main.rs"

[dependencies]
clip-core.workspace = true
clip-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
